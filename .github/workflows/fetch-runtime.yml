# COPY THIS FILE CONTENT into a new file named:
#   .github/workflows/fetch-runtime.yml
# on the arena/019ff872-vigilant-octo-tribble branch via the GitHub web
# editor (this sandbox's GitHub App token is not allowed to push workflow
# files, which is why this step needs a human).
#
# What it does: when trigger-wine.txt changes on the arena branch, a GitHub
# runner downloads the portable Wine wow64 build + an Xvfb runtime bundle and
# pushes them onto the arena branch so the sandbox can fetch them via git
# (the sandbox can only reach github.com / npm / PyPI).
name: fetch-runtime
on:
  push:
    paths:
      - "trigger-wine.txt"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download wine + bundle Xvfb
        run: |
          curl -L --retry 5 -o /tmp/wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/11.15/wine-11.15-amd64-wow64.tar.xz
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          mkdir -p /tmp/xvfb && cp -L /usr/bin/Xvfb /tmp/xvfb/
          for lib in $(ldd /usr/bin/Xvfb | awk '{print $3}' | grep '^/'); do cp -L --parents "$lib" /tmp/xvfb/; done
          tar -C /tmp/xvfb -cJf /tmp/xvfb-runtime.tar.xz .
          mkdir -p tools/legacy
          cp /tmp/wine.tar.xz tools/legacy/wine.tar.xz
          cp /tmp/xvfb-runtime.tar.xz tools/legacy/xvfb-runtime.tar.xz
      - name: Push blobs onto the arena branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "wine-mirror"
          git add -f tools/legacy/wine.tar.xz tools/legacy/xvfb-runtime.tar.xz
          git commit -m "transient: wine wow64 + xvfb runtime mirror"
          git push origin HEAD:arena/019ff872-vigilant-octo-tribble
